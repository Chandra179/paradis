[workspace]
resolver = "3"
members = ["server", "crates/example", "crates/extraction"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Declare every dependency version here; member crates inherit with
# `name.workspace = true`.
[workspace.dependencies]
axum = "0.8"
config = { version = "0.15", default-features = false, features = ["yaml"] }
example = { path = "crates/example" }
extraction = { path = "crates/extraction" }
html2text = { version = "0.17", default-features = false }
legible = "0.5.1"
quick-xml = { version = "0.42", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "time"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
mod_module_files = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
